name: Desktop app

# Tests on every pull request. Installers for Windows, macOS and Linux are built on pushes to main
# (download them from the run's "Artifacts") and published as a GitHub Release for tags like v1.0.0.
# A release can also be made from the Actions tab: "Run workflow" with a version such as v0.2.0
# (the tag is then created on the commit that was built).
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Make a release with this version tag (e.g. v0.2.0); leave empty to only build'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  build:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            files: release/*.exe
          - os: macos-latest
            files: release/*.dmg
          - os: ubuntu-latest
            files: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --publish never
        env:
          # the app is not code-signed (Windows/macOS will ask "are you sure?" the first time)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: The-Labyrinth-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      # publish with GitHub's own command-line tool (no third-party actions needed)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          gh release create "$TAG" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "The Labyrinth $TAG" \
            --generate-notes
