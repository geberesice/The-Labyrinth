name: Desktop app

# Tests on every pull request. Installers for Windows, macOS and Linux are built on pushes to main
# (download them from the run's "Artifacts") and published as a GitHub Release for tags like v1.0.0.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  build:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            files: release/*.exe
          - os: macos-latest
            files: release/*.dmg
          - os: ubuntu-latest
            files: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --publish never
        env:
          # the app is not code-signed (Windows/macOS will ask "are you sure?" the first time)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: The-Labyrinth-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
